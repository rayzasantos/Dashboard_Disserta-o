name: Sincronizar com Hugging Face Hub

on:
  push:
    branches: [main, master]
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Enviar código para o Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://RayzaSantos:$HF_TOKEN@huggingface.co/spaces/RayzaSantos/Dashboard-Dissertacao HEAD:main
